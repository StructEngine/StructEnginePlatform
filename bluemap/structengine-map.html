<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>StructEngine BlueMap</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f0d; }
    #map-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #18251c, #090d0a 70%);
      color: #9db39a; font: 14px/1.6 'Segoe UI', 'Microsoft YaHei', sans-serif;
      letter-spacing: 1px; z-index: 10; transition: opacity .25s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #hint {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      padding: 7px 14px; border: 1px solid rgba(124,189,75,.35); border-radius: 999px;
      background: rgba(10,15,11,.78); color: #b9cbb5; font: 12px/1 'Segoe UI', 'Microsoft YaHei', sans-serif;
      pointer-events: none; z-index: 5; white-space: nowrap;
    }
    #hint.error { color: #ff8b8b; border-color: rgba(255,100,100,.4); }
  </style>
</head>
<body>
  <iframe id="map-frame" src="index.html#world" allow="fullscreen"></iframe>
  <div id="loading">正在加载 BlueMap 地图...</div>
  <div id="hint">点击地图选择建筑中心</div>
  <script>
    (function () {
      'use strict';
      const frame = document.getElementById('map-frame');
      const loading = document.getElementById('loading');
      const hint = document.getElementById('hint');
      let hooked = false;
      let attempts = 0;
      let markerSet = null;
      let marker = null;

      function send(type, payload) {
        try {
          parent.postMessage({ source: 'structengine-bluemap', type: type, payload: payload || {} }, '*');
        } catch (e) { /* parent may be gone */ }
      }

      function hideBlueMapUi(doc) {
        if (!doc || doc.getElementById('structengine-hide-ui')) return;
        const style = doc.createElement('style');
        style.id = 'structengine-hide-ui';
        style.textContent = [
          '#app { display: none !important; }',
          '#map-container { cursor: crosshair !important; }',
          'html, body { overflow: hidden !important; background: #0b0f0d !important; }'
        ].join('\n');
        (doc.head || doc.documentElement).appendChild(style);
      }

      function ensureMarker(w, x, y, z) {
        try {
          const B = w.BlueMap;
          if (!B || !B.MarkerSet || !B.HtmlMarker) return;
          if (!markerSet) {
            markerSet = new B.MarkerSet('structengine-selection');
            markerSet.data.toggleable = false;
            markerSet.data.listed = false;
            w.bluemap.mapViewer.markers.add(markerSet);
          }
          if (!marker) {
            marker = new B.HtmlMarker('structengine-center');
            marker.data.listed = false;
            marker.html = '<div style="width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid #0f1410;border-radius:50%;background:#7cbd4b;box-shadow:0 0 0 2px #7cbd4b,0 0 18px rgba(124,189,75,.9);"></div>';
            markerSet.add(marker);
          }
          marker.position.set(x, y, z);
        } catch (e) {
          send('error', { message: 'marker: ' + String(e) });
        }
      }

      function hook() {
        try {
          const w = frame.contentWindow;
          if (!w || !w.bluemap || !w.bluemap.mapViewer || !w.bluemap.mapViewer.events) return false;
          if (hooked) return true;
          hideBlueMapUi(frame.contentDocument);
          const events = w.bluemap.mapViewer.events;
          events.addEventListener('bluemapMapInteraction', function (ev) {
            const detail = ev && ev.detail ? ev.detail : {};
            const hit = detail.hit || (detail.intersections && detail.intersections[0]);
            if (!hit || !hit.point) return;
            const p = hit.point;
            const mapId = w.bluemap.mapViewer.map && w.bluemap.mapViewer.map.data
              ? w.bluemap.mapViewer.map.data.id : null;
            ensureMarker(w, p.x, p.y, p.z);
            send('pick', {
              x: Math.floor(p.x),
              z: Math.floor(p.z),
              rawY: p.y,
              mapId: mapId
            });
            hint.textContent = '已选点 X=' + Math.floor(p.x) + ' Z=' + Math.floor(p.z);
          });
          hooked = true;
          loading.classList.add('hidden');
          send('ready', {
            maps: Array.isArray(w.bluemap.maps) ? w.bluemap.maps.map(function (m) { return m.data.id; }) : [],
            currentMap: w.bluemap.mapViewer.map && w.bluemap.mapViewer.map.data
              ? w.bluemap.mapViewer.map.data.id : null,
            version: w.bluemap.settings ? w.bluemap.settings.version : null
          });
          return true;
        } catch (e) {
          send('error', { message: String(e) });
          return true;
        }
      }

      const timer = setInterval(function () {
        attempts++;
        if (hook() || attempts > 160) {
          clearInterval(timer);
          if (!hooked) {
            hint.textContent = 'BlueMap 加载超时，请检查地图服务';
            hint.classList.add('error');
            send('error', { message: 'BlueMap hook timeout' });
          }
        }
      }, 250);

      window.addEventListener('message', function (ev) {
        const data = ev.data || {};
        if (data.source !== 'structengine-platform') return;
        if (data.type === 'focus' && hooked && data.payload) {
          const p = data.payload;
          try {
            const w = frame.contentWindow;
            const controls = w.bluemap.mapViewer.controlsManager;
            if (controls && p.x != null && p.z != null) {
              controls.position.set(p.x, 0, p.z);
              w.bluemap.mapViewer.redraw();
            }
            if (p.marker && p.x != null && p.z != null) {
              ensureMarker(w, p.x, p.y != null ? p.y : 0, p.z);
            }
          } catch (e) {
            send('error', { message: 'focus: ' + String(e) });
          }
        }
      });
    })();
  </script>
</body>
</html>
