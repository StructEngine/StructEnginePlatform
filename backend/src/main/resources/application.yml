server:
  port: ${STRUCTENGINE_SERVER_PORT:8080}

spring:
  # Tomcat 请求处理全部使用 JDK 21 虚拟线程：
  # Controller 中 future.get(timeout) 的同步阻塞不会占用 OS 平台线程。
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:${STRUCTENGINE_LOCAL_CONFIG:./src/main/resources/application-local.yml}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  ai:
    openai:
      base-url: ${STRUCTENGINE_AI_BASE_URL:https://token.dcepstc.com/v1}
      api-key: ${STRUCTENGINE_AI_API_KEY:}
      chat:
        options:
          model: ${STRUCTENGINE_AI_MODEL:cn:deepseek-v4.1-flash}
          temperature: 0.7

structengine:
  server-port: ${STRUCTENGINE_SERVER_PORT:8080}
  # 项目根目录；相对 data-dir 与 dist 均以此为基准。留空则使用 JVM user.dir。
  project-root: ${STRUCTENGINE_PROJECT_ROOT:}
  data-dir: ${STRUCTENGINE_DATA_DIR:./data}
  max-image-mb: ${STRUCTENGINE_MAX_IMAGE_MB:10}
  max-model-blocks: ${STRUCTENGINE_MAX_MODEL_BLOCKS:20000}
  # 构建任务超时（秒），超时后自动标记 FAILED。
  task-timeout-seconds: ${STRUCTENGINE_TASK_TIMEOUT_SECONDS:600}
  # JWT：至少 32 字节；生产必须通过环境变量覆盖。
  jwt-secret: ${STRUCTENGINE_JWT_SECRET:}
  jwt-ttl-hours: ${STRUCTENGINE_JWT_TTL_HOURS:24}
  # 首次安装时创建 admin 的初始密码；admin 已存在时忽略。
  admin-initial-password: ${STRUCTENGINE_ADMIN_INITIAL_PASSWORD:}
  # Snowflake workerId，单实例默认 0。
  snowflake-worker-id: ${STRUCTENGINE_SNOWFLAKE_WORKER_ID:0}
  # 等待插件 RESPONSE_Y 的超时时间（秒）。
  game-rpc-timeout-seconds: ${STRUCTENGINE_GAME_RPC_TIMEOUT_SECONDS:5}
  # 对外可访问的基础地址；为空时按请求 Host 自动推导。
  public-base-url: ${STRUCTENGINE_PUBLIC_BASE_URL:}
