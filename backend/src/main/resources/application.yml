server:
  port: ${STRUCTENGINE_SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

structengine:
  server-port: ${STRUCTENGINE_SERVER_PORT:8080}
  ai-api-url: ${STRUCTENGINE_AI_API_URL:}
  ai-api-key: ${STRUCTENGINE_AI_API_KEY:}
  ai-model: ${STRUCTENGINE_AI_MODEL:}
  data-dir: ${STRUCTENGINE_DATA_DIR:./data}
  max-image-mb: ${STRUCTENGINE_MAX_IMAGE_MB:10}